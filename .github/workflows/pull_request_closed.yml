name: 'Clean up Docker images from PR'

on:
  pull_request:
    types:
    - closed

jobs:
  delete-tag:
    uses: ./.github/workflows/_delete-registry-tag.yml
    if: github.event.pull_request.head.repo.full_name == 'go-shiori/shiori'
    with:
      tag_name: pr-${{ github.event.pull_request.number }}
