basePath: /
definitions:
  api_v1.bookmarkDataResponse:
    properties:
      archiveURL:
        type: string
      content:
        type: string
      ebookURL:
        type: string
      hasArchive:
        type: boolean
      hasContent:
        type: boolean
      hasEbook:
        type: boolean
      hasThumbnail:
        type: boolean
      html:
        type: string
      imageURL:
        type: string
    type: object
  api_v1.bookmarkTagPayload:
    properties:
      tagID:
        type: integer
    required:
    - tagID
    type: object
  api_v1.bulkUpdateBookmarkTagsPayload:
    properties:
      bookmarkIDs:
        items:
          type: integer
        type: array
      tagIDs:
        items:
          type: integer
        type: array
    required:
    - bookmarkIDs
    - tagIDs
    type: object
  api_v1.createBookmarkOptions:
    properties:
      createArchive:
        type: boolean
      createEbook:
        type: boolean
    type: object
  api_v1.createBookmarkPayload:
    properties:
      excerpt:
        type: string
      options:
        $ref: '#/definitions/api_v1.createBookmarkOptions'
      public:
        type: integer
      title:
        type: string
      url:
        type: string
    required:
    - url
    type: object
  api_v1.deleteBookmarksPayload:
    properties:
      ids:
        items:
          type: integer
        type: array
    required:
    - ids
    type: object
  api_v1.infoResponse:
    properties:
      database:
        type: string
      os:
        type: string
      version:
        properties:
          commit:
            type: string
          date:
            type: string
          tag:
            type: string
        type: object
    type: object
  api_v1.loginRequestPayload:
    properties:
      password:
        type: string
      rememberMe:
        type: boolean
      username:
        type: string
    type: object
  api_v1.loginResponseMessage:
    properties:
      expiration:
        format: int64
        type: integer
      token:
        type: string
    type: object
  api_v1.readableResponseMessage:
    properties:
      content:
        type: string
      html:
        type: string
    type: object
  api_v1.updateAccountPayload:
    properties:
      config:
        $ref: '#/definitions/model.UserConfig'
      newPassword:
        type: string
      oldPassword:
        type: string
      owner:
        type: boolean
      username:
        type: string
    type: object
  api_v1.updateBookmarkDataPayload:
    properties:
      createArchive:
        type: boolean
      createEbook:
        type: boolean
      keepMetadata:
        type: boolean
      skipExisting:
        type: boolean
      updateReadable:
        type: boolean
    type: object
  api_v1.updateBookmarkPayload:
    properties:
      excerpt:
        type: string
      public:
        type: integer
      title:
        type: string
      url:
        type: string
    type: object
  api_v1.updateCachePayload:
    properties:
      createArchive:
        type: boolean
      createEbook:
        type: boolean
      ids:
        items:
          type: integer
        type: array
      keepMetadata:
        type: boolean
      skipExist:
        type: boolean
    required:
    - ids
    type: object
  model.Account:
    properties:
      config:
        $ref: '#/definitions/model.UserConfig'
      id:
        type: integer
      owner:
        type: boolean
      password:
        type: string
      username:
        type: string
    type: object
  model.AccountDTO:
    properties:
      config:
        $ref: '#/definitions/model.UserConfig'
      id:
        type: integer
      owner:
        type: boolean
      password:
        type: string
      username:
        type: string
    type: object
  model.BookmarkDTO:
    properties:
      author:
        type: string
      createArchive:
        type: boolean
      createEbook:
        type: boolean
      createdAt:
        type: string
      excerpt:
        type: string
      hasArchive:
        type: boolean
      hasContent:
        type: boolean
      hasEbook:
        type: boolean
      hasThumbnail:
        type: boolean
      html:
        type: string
      id:
        type: integer
      imageURL:
        type: string
      modifiedAt:
        type: string
      public:
        type: integer
      tags:
        items:
          $ref: '#/definitions/model.TagDTO'
        type: array
      title:
        type: string
      url:
        type: string
    type: object
  model.PaginatedResponse-model_BookmarkDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/model.BookmarkDTO'
        type: array
      total:
        type: integer
    type: object
  model.PaginatedResponse-model_TagDTO:
    properties:
      items:
        items:
          $ref: '#/definitions/model.TagDTO'
        type: array
      total:
        type: integer
    type: object
  model.TagDTO:
    properties:
      bookmarkCount:
        description: Number of bookmarks with this tag
        type: integer
      deleted:
        description: Marks when a tag is deleted from a bookmark
        type: boolean
      id:
        type: integer
      name:
        type: string
    type: object
  model.UserConfig:
    properties:
      CreateEbook:
        type: boolean
      HideExcerpt:
        type: boolean
      HideThumbnail:
        type: boolean
      KeepMetadata:
        type: boolean
      ListMode:
        type: boolean
      MakePublic:
        type: boolean
      ShowId:
        type: boolean
      Theme:
        type: string
      UseArchive:
        type: boolean
    type: object
info:
  contact: {}
  description: Shiori is a simple bookmarks manager. This is the documentation for
    its HTTP API.
  title: Shiori API
  version: "1.0"
paths:
  /api/v1/accounts:
    get:
      description: List accounts
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.AccountDTO'
            type: array
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: List accounts
      tags:
      - accounts
    post:
      consumes:
      - application/json
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.AccountDTO'
        "400":
          description: Bad Request
        "409":
          description: Account already exists
        "500":
          description: Internal Server Error
      summary: Create an account
      tags:
      - accounts
  /api/v1/accounts/{id}:
    delete:
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No content
        "400":
          description: Invalid ID
        "404":
          description: Account not found
        "500":
          description: Internal Server Error
      summary: Delete an account
      tags:
      - accounts
    patch:
      consumes:
      - application/json
      parameters:
      - description: Account ID
        in: path
        name: id
        required: true
        type: integer
      - description: Account data
        in: body
        name: account
        required: true
        schema:
          $ref: '#/definitions/api_v1.updateAccountPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.AccountDTO'
        "400":
          description: Invalid ID/data
        "404":
          description: Account not found
        "409":
          description: Account already exists
        "500":
          description: Internal Server Error
      summary: Update an account
      tags:
      - accounts
  /api/v1/auth/account:
    patch:
      parameters:
      - description: Account data
        in: body
        name: payload
        schema:
          $ref: '#/definitions/api_v1.updateAccountPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Account'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Update account information
      tags:
      - Auth
  /api/v1/auth/login:
    post:
      consumes:
      - application/json
      parameters:
      - description: Login data
        in: body
        name: payload
        schema:
          $ref: '#/definitions/api_v1.loginRequestPayload'
      produces:
      - application/json
      responses:
        "200":
          description: Login successful
          schema:
            $ref: '#/definitions/api_v1.loginResponseMessage'
        "400":
          description: Invalid login data
      summary: Login to an account using username and password
      tags:
      - Auth
  /api/v1/auth/logout:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: Logout successful
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Logout from the current session
      tags:
      - Auth
  /api/v1/auth/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Account'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Get information for the current logged in user
      tags:
      - Auth
  /api/v1/auth/refresh:
    post:
      produces:
      - application/json
      responses:
        "200":
          description: Refresh successful
          schema:
            $ref: '#/definitions/api_v1.loginResponseMessage'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Refresh a token for an account
      tags:
      - Auth
  /api/v1/bookmarks:
    delete:
      parameters:
      - description: Delete Bookmarks Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.deleteBookmarksPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "400":
          description: Invalid request payload
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Delete one or more bookmarks.
      tags:
      - Bookmarks
    get:
      parameters:
      - description: Search keyword
        in: query
        name: keyword
        type: string
      - description: Comma-separated list of tags to include
        in: query
        name: tags
        type: string
      - description: Comma-separated list of tags to exclude
        in: query
        name: exclude
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 30, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PaginatedResponse-model_BookmarkDTO'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: List bookmarks with optional filtering and pagination.
      tags:
      - Bookmarks
    post:
      parameters:
      - description: Create Bookmark Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.createBookmarkPayload'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/model.BookmarkDTO'
        "400":
          description: Invalid request payload
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Create a new bookmark.
      tags:
      - Bookmarks
  /api/v1/bookmarks/{id}:
    get:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BookmarkDTO'
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
      security:
      - ApiKeyAuth: []
      summary: Get a bookmark by ID.
      tags:
      - Bookmarks
    put:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Bookmark Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.updateBookmarkPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BookmarkDTO'
        "400":
          description: Invalid request payload
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
      security:
      - ApiKeyAuth: []
      summary: Update an existing bookmark.
      tags:
      - Bookmarks
  /api/v1/bookmarks/{id}/data:
    get:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_v1.bookmarkDataResponse'
        "400":
          description: Invalid bookmark ID
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
      security:
      - ApiKeyAuth: []
      summary: Get bookmark data and resource URLs.
      tags:
      - Bookmarks
    put:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      - description: Update Bookmark Data Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.updateBookmarkDataPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_v1.bookmarkDataResponse'
        "400":
          description: Invalid bookmark ID or payload
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
        "500":
          description: Failed to update bookmark data
      security:
      - ApiKeyAuth: []
      summary: Update bookmark data (content, archive, ebook).
      tags:
      - Bookmarks
  /api/v1/bookmarks/{id}/readable:
    get:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_v1.readableResponseMessage'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Get readable version of bookmark.
      tags:
      - Bookmarks
  /api/v1/bookmarks/{id}/tags:
    delete:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      - description: Remove Tag Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.bookmarkTagPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
      security:
      - ApiKeyAuth: []
      summary: Remove a tag from a bookmark.
      tags:
      - Bookmarks
    get:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.TagDTO'
            type: array
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark not found
      security:
      - ApiKeyAuth: []
      summary: Get tags for a bookmark.
      tags:
      - Bookmarks
    post:
      parameters:
      - description: Bookmark ID
        in: path
        name: id
        required: true
        type: integer
      - description: Add Tag Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.bookmarkTagPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
        "403":
          description: Token not provided/invalid
        "404":
          description: Bookmark or tag not found
      security:
      - ApiKeyAuth: []
      summary: Add a tag to a bookmark.
      tags:
      - Bookmarks
  /api/v1/bookmarks/bulk/tags:
    put:
      parameters:
      - description: Bulk Update Bookmark Tags Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.bulkUpdateBookmarkTagsPayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BookmarkDTO'
            type: array
        "400":
          description: Invalid request payload
        "403":
          description: Token not provided/invalid
        "404":
          description: No bookmarks found
      security:
      - ApiKeyAuth: []
      summary: Bulk update tags for multiple bookmarks.
      tags:
      - Bookmarks
  /api/v1/bookmarks/cache:
    put:
      parameters:
      - description: Update Cache Payload
        in: body
        name: payload
        required: true
        schema:
          $ref: '#/definitions/api_v1.updateCachePayload'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BookmarkDTO'
        "403":
          description: Token not provided/invalid
      security:
      - ApiKeyAuth: []
      summary: Update Cache and Ebook on server.
      tags:
      - Bookmarks
  /api/v1/system/info:
    get:
      description: Get general system information like Shiori version, database, and
        OS
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api_v1.infoResponse'
        "403":
          description: Only owners can access this endpoint
      security:
      - ApiKeyAuth: []
      summary: Get general system information
      tags:
      - System
  /api/v1/system/ping:
    get:
      description: Simple ping endpoint that returns a 200 status code
      produces:
      - application/json
      responses:
        "200":
          description: Pong
      summary: Ping the system
      tags:
      - System
  /api/v1/tags:
    get:
      description: List all tags with pagination
      parameters:
      - description: Include bookmark count for each tag
        in: query
        name: with_bookmark_count
        type: boolean
      - description: Filter tags by bookmark ID
        in: query
        name: bookmark_id
        type: integer
      - description: Search tags by name
        in: query
        name: search
        type: string
      - description: 'Page number (default: 1)'
        in: query
        name: page
        type: integer
      - description: 'Items per page (default: 30, max: 100)'
        in: query
        name: limit
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.PaginatedResponse-model_TagDTO'
        "403":
          description: Authentication required
        "500":
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: List tags
      tags:
      - Tags
    post:
      consumes:
      - application/json
      description: Create a new tag. Returns 409 Conflict if a tag with the same name
        already exists.
      parameters:
      - description: Tag data
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/model.TagDTO'
      produces:
      - application/json
      responses:
        "201":
          description: Tag created
          schema:
            $ref: '#/definitions/model.TagDTO'
        "400":
          description: Invalid request
        "403":
          description: Authentication required
        "409":
          description: Tag already exists
        "500":
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: Create tag
      tags:
      - Tags
  /api/v1/tags/{id}:
    delete:
      description: Delete a tag
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "403":
          description: Authentication required
        "404":
          description: Tag not found
        "500":
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: Delete tag
      tags:
      - Tags
    get:
      description: Get a tag by ID
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TagDTO'
        "403":
          description: Authentication required
        "404":
          description: Tag not found
        "500":
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: Get tag
      tags:
      - Tags
    put:
      consumes:
      - application/json
      description: Update an existing tag
      parameters:
      - description: Tag ID
        in: path
        name: id
        required: true
        type: integer
      - description: Tag data
        in: body
        name: tag
        required: true
        schema:
          $ref: '#/definitions/model.TagDTO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.TagDTO'
        "400":
          description: Invalid request
        "403":
          description: Authentication required
        "404":
          description: Tag not found
        "500":
          description: Internal server error
      security:
      - ApiKeyAuth: []
      summary: Update tag
      tags:
      - Tags
securityDefinitions:
  ApiKeyAuth:
    description: Type "Bearer" followed by a space and the JWT token.
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
